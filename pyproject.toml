[project]
name = "synthia"
version = "0.1.0"
description = "Privacy-preserving synthetic tabular data for healthcare: three generators, differential privacy with measured accounting, fidelity, utility and privacy evaluation with confidence intervals."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Raunit Kumar Thakur" }]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
]

[project.scripts]
synthia = "synthia.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.7",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Linux (CI and Docker) must take CPU-only wheels; the default PyPI wheels pull CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "SIM", "RUF", "PL", "C90"]
ignore = [
    "PLR2004",  # magic numbers are documented inline where they matter
    "PLR0913",  # estimator constructors legitimately take many knobs
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "S101", "PLC0415", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-args = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
timeout = 600
filterwarnings = ["error::RuntimeWarning:synthia", "ignore::DeprecationWarning"]
